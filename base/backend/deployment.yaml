apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  annotations:
    # Wave 2: arranca con MySQL listo (wave 0); el initContainer migra el esquema
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      # Migracion del esquema antes de arrancar la API. Antes era un Job hook (Sync, wave 1),
      # pero el auto-sync por self-heal no ejecuta hooks: al recrear un ambiente borrado,
      # el backend arrancaba sin tablas. Como initContainer, todo pod nuevo migra primero,
      # venga de Argo CD, del self-heal o de un kubectl apply. "migrate deploy" es
      # idempotente (~1 s sin cambios) y Prisma usa un lock de BD si hubiera varias replicas.
      # El bucle espera a MySQL si todavia no responde (p. ej. al recrear todo a la vez).
      initContainers:
        - name: migrate
          # Misma imagen que el backend: trae prisma CLI, schema y migraciones
          image: ghcr.io/lolxd123v2/beybladeperu-backend
          command:
            - sh
            - -c
            - |
              until node_modules/.bin/prisma migrate deploy --schema=database/prisma/schema.prisma; do
                echo "migracion fallida, reintento en 5 s"; sleep 5
              done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: beybladeperu-secrets
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
      containers:
        - name: backend
          # Sin tag a proposito: cada overlay fija el SHA con "images.newTag"
          image: ghcr.io/lolxd123v2/beybladeperu-backend
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: beybladeperu-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: beybladeperu-secrets
                  key: JWT_SECRET
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: beybladeperu-secrets
                  key: CLOUDINARY_API_KEY
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: beybladeperu-secrets
                  key: CLOUDINARY_API_SECRET
            - name: BREVO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: beybladeperu-secrets
                  key: BREVO_API_KEY
          # startup: da hasta 60 s al arranque sin que liveness reinicie el pod
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20
          # Al terminar, el pod sigue atendiendo 10 s antes de recibir SIGTERM: da tiempo
          # a que Traefik saque su endpoint. Sin esto, en cada rollout/rollback algunas
          # peticiones iban a la IP del pod ya cerrado y colgaban hasta el timeout (504).
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          # readiness: saca al pod del Service mientras no responda
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          # liveness: reinicia el contenedor si el proceso se cuelga
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi

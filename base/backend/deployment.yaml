apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  annotations:
    # Wave 2: arranca con MySQL listo (wave 0) y el esquema migrado (wave 1)
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backend
          # Sin tag a proposito: cada overlay fija el SHA con "images.newTag"
          image: ghcr.io/lolxd123v2/beybladeperu-backend
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: beybladeperu-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: beybladeperu-secrets
                  key: JWT_SECRET
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: beybladeperu-secrets
                  key: CLOUDINARY_API_KEY
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: beybladeperu-secrets
                  key: CLOUDINARY_API_SECRET
            - name: BREVO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: beybladeperu-secrets
                  key: BREVO_API_KEY
          # startup: da hasta 60 s al arranque sin que liveness reinicie el pod
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20
          # readiness: saca al pod del Service mientras no responda
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          # liveness: reinicia el contenedor si el proceso se cuelga
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi

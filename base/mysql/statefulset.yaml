apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  annotations:
    # Wave 0: Argo CD espera a que el pod este Ready antes de pasar a la wave 1
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: beybladeperu
            - name: MYSQL_USER
              value: beyblade
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: beybladeperu-secrets
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: beybladeperu-secrets
                  key: MYSQL_ROOT_PASSWORD
          # Por TCP (127.0.0.1) a proposito: durante la inicializacion la imagen
          # levanta un servidor temporal solo por socket y no debe contar como listo
          startupProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  # Un PVC por pod (data-mysql-0); en k3d lo sirve la StorageClass local-path
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

# Wave 1: aplica las migraciones versionadas antes de que arranque el backend.
# Un Job es inmutable, asi que un cambio de tag de imagen haria fallar el sync
# si fuera un recurso normal. Por eso se declara como hook Sync: Argo CD borra
# el Job anterior y crea uno nuevo en cada sincronizacion, respetando la wave.
apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prisma-migrate
    spec:
      # Never: cada reintento es un pod nuevo (backoff 10s, 20s, 40s, 80s), se conservan
      # los logs de los fallidos y backoffLimit no corta un intento que ya esta corriendo
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: migrate
          # Misma imagen que el backend: trae prisma CLI, schema y migraciones
          image: ghcr.io/lolxd123v2/beybladeperu-backend
          command:
            - node_modules/.bin/prisma
            - migrate
            - deploy
            - --schema=database/prisma/schema.prisma
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: beybladeperu-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi

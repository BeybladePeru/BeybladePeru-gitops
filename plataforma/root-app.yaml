# App of apps: la unica Application que se aplica a mano, una vez, al crear el cluster:
#   kubectl apply -f plataforma/root-app.yaml
# Desde ahi Argo CD gestiona todo lo que esta en apps/ (plataforma y los 3 ambientes):
# agregar, cambiar o quitar una Application tambien es un PR.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: beybladeperu-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BeybladePeru/BeybladePeru-gitops.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

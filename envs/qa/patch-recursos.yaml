# QA usa por pod los mismos recursos que la base (cercanos a prod) para que las
# pruebas se parezcan a produccion, pero con una sola replica del frontend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: backend
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: frontend
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }

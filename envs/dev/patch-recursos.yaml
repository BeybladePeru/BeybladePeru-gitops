# DEV: 1 replica de cada cosa y recursos minimos
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: backend
          resources:
            requests: { cpu: 50m, memory: 160Mi }
            limits: { memory: 384Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: frontend
          resources:
            requests: { cpu: 25m, memory: 96Mi }
            limits: { memory: 256Mi }
